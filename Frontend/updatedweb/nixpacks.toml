# nixpacks.toml
# Railway build configuration for the PHP Frontend service.
# This enables pdo_mysql and other required PHP extensions.

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mysqli", "php83Extensions.curl", "php83Extensions.mbstring", "php83Extensions.openssl"]

[start]
cmd = "php -S 0.0.0.0:$PORT -t Frontend"
